                    </button>
                    <button id="logoutButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15" />

                          </svg>                          
                        Logout
                </button>
                </div>
              </div>
        </div>
    </header>

    <div id="mainContainer">
        <div id="chatSection">
            <div id="controlButtons">
                <button id="startButton">Start</button>
                <button id="stopButton" disabled>Stop</button>
            </div>
            <div id="chatBox"></div>
        </div>
        
        <!-- Options Section -->
        <div id="optionsContainer">
            <h2>Options</h2>
            <div class="option">
                <input type="checkbox" id="autoActionsCheckbox">
                <label for="autoActionsCheckbox">Generate Actions Automatically</label>
            </div>
            <button id="applyOptionsButton">Apply</button> <!-- Smaller apply button -->
        </div>
    </div>

     <!-- Modal for Settings -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-button" id="closeSettingsModal">&times;</span>
            <h2>Settings</h2>
            <div id="settingsOptions">
               <!-- Fields for client_id, redirect_uri, and port -->
            <label for="client_id">Client ID (Twitch):</label>
            <input type="text" id="client_id" name="client_id" placeholder="Enter Client ID" required>
            <br><br>

            <label for="port">Port:</label>
            <input type="number" id="port" name="port" placeholder="Enter Port" required>
            <br><br>

            <!-- Buttons for reset and save -->
            <button id="resetSettingsButton">Reset to Default</button>
            <button id="saveSettingsButton">Save Settings</button>
            </div>
        </div>
  </div>

    <script src="./src/ui/mainRenderer.js"></script>
</body>
</html>
